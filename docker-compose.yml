### All components for a full ... Installation

services:
  ### ------------------------------------------
  ###             ... Services
  ### ------------------------------------------

  ### Frontend service
  ...-frontend:
    image: ghcr.io/your-org/tracking-frontend:latest
    container_name: ...-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - ...-backend
    networks:
      - ...-network
    environment:
      - BACKEND_HOSTNAME=...-backend
      - BACKEND_PORT=8000
      - TILES_HOST=...-versatiles
      - TILES_PORT=8080

  ### Backend service
  ...-backend:
    image: ghcr.io/your-org/tracking-backend:latest
    container_name: ...-backend
    restart: unless-stopped
    volumes:
      - ...-data:/data ### TODO: do we need this? isn't this only for an sqlite db? could that be offloaded into the pgsql that we host anyway?
    networks:
      - ...-network
    environment:
      - DATA_PATH=/data

  ### ------------------------------------------
  ###           Offline-Maps server
  ### ------------------------------------------
  ...-versatiles:
    image: versatiles/versatiles-frontend:latest-alpine  # with frontend
    container_name: ...-versatiles
    restart: unless-stopped
    volumes:
      - ${PWD}:/data:ro ### mount the current directory as read-only for map data
    command: ${VERSATILES_FILE:-tiles.versatiles}
    networks:
      - ...-network



  # TODO: add pgsql and chirpstack services
  # Chirpstack: https://github.com/chirpstack/chirpstack-docker/blob/master/docker-compose.yml
  # we use http push, so so mqtt is not needed



volumes:
  ...-data:
    driver: local
  versatiles-data:
    driver: local

networks:
# TODO: do we want to separate nginx and backend networks?
  ...-network:
    driver: bridge