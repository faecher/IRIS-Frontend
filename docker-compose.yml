services:

  ### Frontend service
  IRIS-frontend:
    image: ghcr.io/faecher/iris-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - IRIS-network
    environment:
      BACKEND_HOSTNAME: IRIS-server
      BACKEND_PORT: 8080
      TILES_HOST: versatiles
      TILES_PORT: 8080

  ### Backend service
  IRIS-server:
    image: ghcr.io/faecher/iris-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - IRIS-network
    environment:
      # SERVER_ADDRESS: "0.0.0.0" # Port is 8080
      # SERVER_READ_TIMEOUT: 10 # seconds
      # SERVER_WRITE_TIMEOUT: 10 # seconds
      # SERVER_IDLE_TIMEOUT: 2 # minutes
      # SERVER_MAX_HEADER_BYTES: 1048576 # 1 MB

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: iris
      DB_PASSWORD: secret # Will be preferred over DB_PASSWORD_FROM_FILE if both are set
      # DB_PASSWORD_FROM_FILE: /run/secrets/iris_db_password
      # DB_NAME: iris
      # DB_SSLMODE: disable
      DB_MAX_RETRIES: 5
      # DB_RETRY_INTERVAL: 5

      # MCP_RESOURCE_UPDATE: 5 # MCP resource update interval in seconds

      # If Auth-Token is set, the token will take priority over email/password for authentication.
      # TRACCAR_HOST: http://localhost:80
      # TRACCAR_EMAIL: testmail@test.com
      # TRACCAR_PASSWORD: 123456
      # TRACCAR_AUTH_TOKEN: 1234
      # TRACCAR_AUTH_TIMEOUT: 10

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: secret
    networks:
      - IRIS-network
    volumes:
      - postgres-data:/var/lib/postgresql

networks:
  IRIS-network:
    driver: overlay